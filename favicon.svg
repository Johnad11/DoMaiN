<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#07090E"/>
    </radialGradient>

    <!-- Neon Cyan & Purple Primary Gradient -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Secondary Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Hexagon -->
  <polygon points="256,24 464,120 464,392 256,488 48,392 48,120"
           fill="url(#bgGrad)"
           stroke="url(#cyberNeon)"
           stroke-width="12"
           stroke-linejoin="round"
           filter="url(#softGlow)"/>

  <!-- Inner Tech Circuit Ring -->
  <polygon points="256,56 432,138 432,374 256,456 80,374 80,138"
           fill="none"
           stroke="#00F0FF"
           stroke-opacity="0.25"
           stroke-width="4"
           stroke-dasharray="16 10"/>

  <!-- Circuit nodes -->
  <circle cx="256" cy="24" r="8" fill="#00F0FF" filter="url(#softGlow)"/>
  <circle cx="464" cy="120" r="8" fill="#7B2CBF" filter="url(#softGlow)"/>
  <circle cx="464" cy="392" r="8" fill="#FF007F" filter="url(#softGlow)"/>
  <circle cx="256" cy="488" r="8" fill="#00F0FF" filter="url(#softGlow)"/>
  <circle cx="48" cy="392" r="8" fill="#7B2CBF" filter="url(#softGlow)"/>
  <circle cx="48" cy="120" r="8" fill="#00F0FF" filter="url(#softGlow)"/>

  <!-- Futuristic Stylized "D" Glyph with Tech Slices -->
  <g filter="url(#neonGlow)">
    <!-- Back Spine of D -->
    <path d="M 160 130 L 250 130 C 330 130 380 180 380 256 C 380 332 330 382 250 382 L 160 382 Z"
          fill="none"
          stroke="url(#cyberNeon)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Inner Cutout / Core Pulse -->
    <path d="M 205 195 L 245 195 C 290 195 320 220 320 256 C 320 292 290 317 245 317 L 205 317 Z"
          fill="#0B0E17"
          stroke="#00F0FF"
          stroke-width="8"/>

    <!-- Central Neural Spark Node -->
    <circle cx="256" cy="256" r="14" fill="#00F0FF" filter="url(#softGlow)"/>
    <line x1="210" y1="256" x2="242" y2="256" stroke="#00F0FF" stroke-width="4"/>
    <line x1="270" y1="256" x2="315" y2="256" stroke="#00F0FF" stroke-width="4"/>
  </g>
</svg>
